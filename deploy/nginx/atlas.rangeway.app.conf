# Atlas behind the existing Rangeway nginx.
#
# This host already terminates TLS for the public sites, so Atlas runs without
# Caddy and is published on loopback only. nginx owns 80/443 and forwards to it.
#
# Install:
#   cp deploy/nginx/atlas.rangeway.app.conf /etc/nginx/sites-available/atlas
#   ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/atlas
#   certbot --nginx -d atlas.rangeway.app
#   nginx -t && systemctl reload nginx
#
# Certbot rewrites the ssl_certificate lines below when it issues the
# certificate. Run `nginx -t` before every reload; a broken config here would
# take down every other Rangeway site on this server, not just Atlas.

server {
    listen 80;
    listen [::]:80;
    server_name atlas.rangeway.app;

    # Certbot serves its challenge over plain HTTP; everything else is upgraded.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atlas.rangeway.app;

    ssl_certificate     /etc/letsencrypt/live/atlas.rangeway.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.rangeway.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Atlas is an internal operating system; it should never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Diligence uploads and rendered report PDFs both exceed the 1m default.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Atlas issues Secure session cookies and builds absolute Google OAuth
        # redirects. Without this it would believe the request arrived over HTTP.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # A deterministic PDF render can outlast the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}
