        projectId: { type: string, format: uuid }
        workstreamId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [action, deliverable, follow_up, approval, research] }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 10000, default: "" }
        ownerUserId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [inbox, next, in_progress, waiting, done, canceled], default: inbox }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        dueAt: { type: [string, "null"], format: date-time }
        position: { type: number, default: 0 }
        labelIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    WorkItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        workstreamId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [action, deliverable, follow_up, approval, research] }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 10000 }
        ownerUserId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [inbox, next, in_progress, waiting, done, canceled] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        dueAt: { type: [string, "null"], format: date-time }
        position: { type: number }
        labelIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    WorkMoveInput:
      type: object
      additionalProperties: false
      required: [status, position]
      properties:
        status: { type: string, enum: [inbox, next, in_progress, waiting, done, canceled] }
        position: { type: number }
    MergeInput:
      type: object
      additionalProperties: false
      required: [intoId]
      properties:
        intoId: { type: string, format: uuid }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: atlas-web
        apiVersion:
          type: string
          const: v2
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, apiVersion, contractVersion, release]
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: atlas-web
        apiVersion:
          type: string
          const: v2
        contractVersion:
          type: string
          const: atlas-v2-foundation-v1
        release:
          type: string
          pattern: "^[0-9a-f]{40}$"
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
    OrganizationUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    OrganizationResponse:
      type: object
      additionalProperties: false
      required: [organization]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              minLength: 1
              maxLength: 200
    ActorContext:
      type: object
      additionalProperties: false
      required:
        - actorId
        - actorType
        - actorName
        - organizationId
        - role
        - requestId
      properties:
        actorId:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [human, agent, automation]
        actorName:
          type: string
          minLength: 1
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, viewer]
        requestId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    ApiErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            requestId:
              type: string
              format: uuid
            details: true
