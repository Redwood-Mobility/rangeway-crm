openapi: 3.1.0
info:
  title: Atlas V2 API
  version: 2.0.0
  summary: Rangeway's internal relationship and site-development API.
  description: >-
    The authenticated API boundary for Atlas. Clients may present either a signed
    human session cookie or one Atlas bearer credential, but never both.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://atlas.rangeway.app/api/v2
    description: Atlas production
tags:
  - name: System
    description: Service health and readiness.
  - name: Identity
    description: Actor authentication and session lifecycle.
  - name: Organizations
    description: Organization-scoped foundation operations.
  - name: Operating Core
    description: Project Rooms, universal work, operating context, and relationships.
security:
  - sessionCookie: []
  - atlasBearer: []
paths:
  /api/auth/google:
    get:
      operationId: beginGoogleWorkspaceSignIn
      summary: Begin Google Workspace sign-in
      description: >-
        Public browser redirect surface outside the /api/v2 namespace. Creates a
        short-lived, HTTP-only OAuth state cookie and redirects to Google. It does
        not create an Atlas session or link a Google subject.
      tags: [Identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      servers:
        - url: https://atlas.rangeway.app
          description: Atlas production origin
      # Browser redirect endpoint: a successful OAuth start is intentionally 302,
      # and its only configured failure is 503 rather than a fabricated 4XX.
      responses:
        "302":
          description: Redirect to the configured Google OAuth authorization endpoint.
          headers:
            Location:
              description: Google OAuth authorization URL.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Short-lived, HTTP-only OAuth state cookie.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "503":
          description: Google OAuth is not configured.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                const: Google SSO is not configured.
  /api/auth/google/callback:
    get:
      operationId: completeGoogleWorkspaceSignIn
      summary: Complete Google Workspace sign-in
      description: >-
        Public Google OAuth callback outside the /api/v2 namespace. Validates the
        state cookie, exchanges and verifies Google's ID token, then atomically
        links or updates the pre-provisioned Atlas human identity. Only a verified
        callback may persist Google's immutable subject. Success creates the
        canonical signed human session and redirects to ATLAS_ORIGIN.
      tags: [Identity]
      security: []
      servers:
        - url: https://atlas.rangeway.app
          description: Atlas production origin
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      # Browser redirect endpoint: a successful verified callback is intentionally 302.
      responses:
        "302":
          description: Session created and browser redirected to the configured Atlas origin.
          headers:
            Location:
              description: Configured Atlas browser origin.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Signed Atlas human session plus expiration of the OAuth state cookie.
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          description: Missing, malformed, expired, or mismatched OAuth state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Expires the OAuth state cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: The verified Google identity cannot authenticate an enabled Atlas human.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Expires the OAuth state cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "500":
          description: Google exchange, verification, or identity persistence failed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Expires the OAuth state cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /health:
    get:
      operationId: getHealth
      summary: Get API health
      description: Returns the V2 web service identity without requiring authentication.
      tags: [System]
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The API process is available.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/ApiError"
        4XX:
          $ref: "#/components/responses/ApiError"
  /ready:
    get:
      operationId: getReadiness
      summary: Get API readiness
      description: >-
        Proves the web process can reach PostgreSQL through the expected
        least-privilege role and permission contract. The response identifies
        the exact release commit without exposing database details.
      tags: [System]
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The exact Atlas release and database contract are ready.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ApiError"
        4XX:
          $ref: "#/components/responses/ApiError"
  /me:
    get:
      operationId: getCurrentActor
      summary: Get the current actor
      description: Resolves the authenticated human, agent, or automation actor.
      tags: [Identity]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The current actor context.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actor]
                properties:
                  actor:
                    $ref: "#/components/schemas/ActorContext"
        "401":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /auth/local/login:
    post:
      operationId: createLocalSession
      summary: Create a local development session
      description: >-
        Verifies an Argon2id password and creates a signed human session. This route
        is hidden with a 404 unless local authentication is enabled outside production.
      tags: [Identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: The signed session was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Secure, HTTP-only signed human session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actor]
                properties:
                  actor:
                    $ref: "#/components/schemas/ActorContext"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /auth/logout:
    post:
      operationId: deleteCurrentSession
      summary: Clear the current human session
      description: Clears the signed session cookie whether or not it is currently valid.
      tags: [Identity]
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The human session cookie was cleared.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: Expired human session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        "500":
          $ref: "#/components/responses/ApiError"
        4XX:
          $ref: "#/components/responses/ApiError"
  /organizations/{organizationId}:
    patch:
      operationId: updateOrganization
      summary: Update an organization name
      description: >-
        Updates the authenticated actor's organization name. Cross-organization
        targets use the same safe NOT_FOUND envelope as unknown resources. This
        narrow foundation operation exists to prove atomic mutation, audit, and
        outbox behavior before Operating Core resources are introduced. Repeating
        the same request with the same idempotency key returns the stored response
        without duplicating the mutation, audit event, or outbox event. Reusing a
        key for a different request returns CONFLICT.
      tags: [Organizations]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdateRequest"
      responses:
        "200":
          description: The organization name was updated and audit/outbox records were committed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /projects:
    get:
      operationId: listProjects
      summary: List authorized Project Rooms
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createProject
      summary: Create a Project Room
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Get an authorized Project Room
      tags: [Operating Core]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      operationId: updateProject
      summary: Update a Project Room
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectPatch" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/archive:
    post:
      operationId: setProjectArchiveState
      summary: Archive or recover a Project Room
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveInput" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      summary: List Project Room members
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: addProjectMember
      summary: Add or update a Project Room member
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMemberInput" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/members/{userId}:
    delete:
      operationId: removeProjectMember
      summary: Remove a non-owner Project Room member
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/health-updates:
    get:
      operationId: listProjectHealthUpdates
      summary: List immutable Project Room health history
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: recordProjectHealth
      summary: Record and apply a Project Room health update
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HealthUpdateInput" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/context-bundle:
    get:
      operationId: getProjectContextBundle
      summary: Get complete authorized Project Room context
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "404": { $ref: "#/components/responses/ApiError" }
  /portfolio:
    get:
      operationId: getPortfolio
      summary: Get authorized portfolio operating state
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /portfolio/health:
    get:
      operationId: getPortfolioHealth
      summary: Get authorized portfolio health totals
      tags: [Operating Core]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /projects/{projectId}/workstreams:
    get:
      operationId: listWorkstreams
      summary: List Project Room workstreams
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createWorkstream
      summary: Create a Project Room workstream
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatingCoreMutation" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /workstreams/{workstreamId}:
    get:
      operationId: getWorkstream
      summary: Get an authorized workstream
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/WorkstreamId" }]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      operationId: updateWorkstream
      summary: Update an authorized workstream
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/WorkstreamId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatingCoreMutation" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items:
    get:
      operationId: listWorkItems
      summary: List authorized universal work items
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createWorkItem
      summary: Create a universal work item
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemInput" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items/{workItemId}:
    get:
      operationId: getWorkItem
      summary: Get an authorized universal work item
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/WorkItemId" }]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      operationId: updateWorkItem
      summary: Update a universal work item
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkItemPatch" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items/{workItemId}/move:
    post:
      operationId: moveWorkItem
      summary: Move one work item in every canonical projection
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkMoveInput" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items/{workItemId}/dependencies/{dependencyId}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
      - $ref: "#/components/parameters/DependencyId"
    post:
      operationId: addWorkItemDependency
      summary: Add an acyclic same-project dependency
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
    delete:
      operationId: removeWorkItemDependency
      summary: Remove a work-item dependency
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items/{workItemId}/archive:
    post:
      operationId: setWorkItemArchiveState
      summary: Archive or recover a universal work item
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveInput" } } }
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /labels:
    get:
      operationId: listLabels
      summary: List organization work labels
      tags: [Operating Core]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createLabel
      summary: Create an organization work label
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatingCoreMutation" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-items/{workItemId}/labels/{labelId}:
    parameters:
      - $ref: "#/components/parameters/WorkItemId"
      - name: labelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addWorkItemLabel
      summary: Add a label to a work item
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
    delete:
      operationId: removeWorkItemLabel
      summary: Remove a label from a work item
      tags: [Operating Core]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /today:
    get:
      operationId: getToday
      summary: Get personal work, decisions, changes, agent activity, and milestones
      tags: [Operating Core]
      responses:
        "200": { $ref: "#/components/responses/OperatingCoreSuccess" }
        4XX: { $ref: "#/components/responses/ApiError" }
  /work-views/{view}:
    get:
      operationId: getCanonicalWorkView
      summary: Get board, list, or calendar projection of the canonical work rows
      tags: [Operating Core]
      parameters:
        - name: view
          in: path
          required: true
          schema: { type: string, enum: [board, list, calendar] }
