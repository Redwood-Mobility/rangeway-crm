        status: { type: string, enum: [planned, active, on_hold, completed, canceled], default: planned }
        health: { type: string, enum: [unknown, on_track, at_risk, off_track], default: unknown }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        strategicArea: { type: string, maxLength: 200, default: "" }
        ownerUserId: { type: string, format: uuid }
        currentFocus: { type: string, maxLength: 10000, default: "" }
        blockerSummary: { type: string, maxLength: 10000, default: "" }
        nextDecision: { type: string, maxLength: 10000, default: "" }
        nextAction: { type: string, maxLength: 10000, default: "" }
    ProjectPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        objective: { type: string, maxLength: 10000 }
        templateType: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [planned, active, on_hold, completed, canceled] }
        health: { type: string, enum: [unknown, on_track, at_risk, off_track] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        strategicArea: { type: string, maxLength: 200 }
        ownerUserId: { type: string, format: uuid }
        currentFocus: { type: string, maxLength: 10000 }
        blockerSummary: { type: string, maxLength: 10000 }
        nextDecision: { type: string, maxLength: 10000 }
        nextAction: { type: string, maxLength: 10000 }
    ProjectMemberInput:
