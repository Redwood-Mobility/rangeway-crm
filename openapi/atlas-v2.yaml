        role: { type: string, enum: [owner, editor, viewer] }
    HealthUpdateInput:
      type: object
      additionalProperties: false
      required: [health, rationale]
      properties:
        health: { type: string, enum: [unknown, on_track, at_risk, off_track] }
        rationale: { type: string, minLength: 1, maxLength: 5000 }
        reportingPeriodStart: { type: string, format: date }
        reportingPeriodEnd: { type: string, format: date }
        sourceCutoff: { type: string, format: date-time }
    WorkItemInput:
      type: object
      additionalProperties: false
      required: [projectId, type, title]
