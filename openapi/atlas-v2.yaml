  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: A valid caller-supplied UUID to retain for end-to-end tracing.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated organization, actor,
        and operation. Use the same key only when retrying the same request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor returned by the previous page.
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkstreamId:
      name: workstreamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DependencyId:
      name: dependencyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    RequestId:
      required: true
      description: The retained or server-generated request UUID.
      schema:
        type: string
        format: uuid
  responses:
    ApiError:
      description: A stable, safe API error. Private and unknown resources both use NOT_FOUND.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
    OperatingCoreSuccess:
      description: Authorized Operating Core result with an optional cursor page.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatingCoreResponse"
    IdempotencyConflict:
      description: IdempotencyConflict - the key was already used with a different request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorBody"
  schemas:
    OperatingCoreResponse:
      type: object
