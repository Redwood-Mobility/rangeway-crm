name: atlas-v2

x-app-service: &app-service
  image: atlas-v2-app:${ATLAS_IMAGE_TAG:-local}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  web:
    <<: *app-service
    build:
      context: .
      target: runtime
    command: ["npm", "start"]
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://atlas_web:${ATLAS_WEB_PASSWORD:-}@db:5432/atlas
      SESSION_SECRET: ${SESSION_SECRET:-}
      ATLAS_ORIGIN: ${ATLAS_ORIGIN:-}
      ARTIFACT_DIR: /app/artifacts
      AUTH_MODE: google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-rangeway.energy}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - atlas-artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v2/health').then(async (response) => { const body = await response.json(); process.exit(response.ok && body.apiVersion === 'v2' ? 0 : 1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *app-service
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://atlas_worker:${ATLAS_WORKER_PASSWORD:-}@db:5432/atlas
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - atlas-artifacts:/app/artifacts
    mem_limit: 384m
    cpus: 0.5

  migrator:
    image: atlas-v2-app:${ATLAS_IMAGE_TAG:-local}
    profiles: [operations]
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://atlas_migrator:${ATLAS_MIGRATOR_PASSWORD:-}@db:5432/atlas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-}
      POSTGRES_DB: atlas
      ATLAS_MIGRATOR_PASSWORD: ${ATLAS_MIGRATOR_PASSWORD:-}
      ATLAS_WEB_PASSWORD: ${ATLAS_WEB_PASSWORD:-}
      ATLAS_WORKER_PASSWORD: ${ATLAS_WORKER_PASSWORD:-}
    volumes:
      - atlas-db:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/001-atlas-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=atlas --dbname=atlas"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 128m
    mem_limit: 1024m
    cpus: 1.0

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    cpus: 0.25

volumes:
  atlas-db:
    name: atlas-db
  atlas-artifacts:
    name: atlas-artifacts
  caddy-data:
    name: atlas-v2-caddy-data
  caddy-config:
    name: atlas-v2-caddy-config
